<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LUXORA FASHION | Contact Us</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <nav class="navbar">
            <a href="index.html" class="logo">LUXORA<span>.</span></a>
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="products.html">Products</a></li>
                <li><a href="gallery.html">Gallery</a></li>
                <li><a href="contact.html" class="active">Contact Us</a></li>
                <li><a href="group-info.html">Group Info</a></li>
            </ul>
            <div class="nav-icons">
                <span>🔍</span>
                <span>🛍️ (0)</span>
            </div>
        </nav>
    </header>

    <section class="section" style="margin-top: 80px;">
        <div class="section-title">
            <h2>Contact Concierge</h2>
        </div>

        <div style="max-width: 650px; margin: 0 auto; background: white; padding: 2rem; box-shadow: var(--shadow-soft);">
            <form id="contactForm">
                <label>Name</label>
                <input type="text" placeholder="Your full name" required>

                <label>Email</label>
                <input type="email" placeholder="Your email address" required>

                <label>Telephone</label>
                <input type="tel" placeholder="Your telephone number" required>

                <label>Subject</label>
                <input type="text" placeholder="Inquiry subject" required>

                <label>Message</label>
                <textarea rows="5" placeholder="Write your message here..." required></textarea>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary">Submit</button>
                    <button type="reset" class="btn btn-outline">Reset</button>
                </div>
            </form>
        </div>
    </section>

    <footer>
        <div class="footer-bottom">
            <p>Designed by Group 08 | Group Number: Group 08 | Year: 2026[cite: 1]</p>
            <p>LUXORA FASHION © 2026. All Rights Reserved.[cite: 1]</p>
        </div>
    </footer>

    <script src="js/main.js"></script>
</body>
</html>
